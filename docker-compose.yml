services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: ghcr.io/biezax/netdata_portal/backend:latest
    container_name: netdata-portal-backend
    # Backend enforces LDAP auth when AUTH_ENABLED=true. Drop this mapping to keep it
    # private — the frontend still reaches it over the internal network.
    ports:
      - "8000:8000"
    # AUTH_ENABLED / LDAP_* / SESSION_* are read from .env (see .env.example).
    env_file:
      - path: .env
        required: false
    environment:
      - ALERT_POLL_INTERVAL=${ALERT_POLL_INTERVAL:-15}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-5}
      - CONNECT_TIMEOUT=${CONNECT_TIMEOUT:-2}
      - ALERT_POLL_CONCURRENCY=${ALERT_POLL_CONCURRENCY:-10}
      - UNREACHABLE_POLL_INTERVAL=${UNREACHABLE_POLL_INTERVAL:-60}
      - HOSTS_FILE=${HOSTS_FILE:-config/hosts.txt}
      - NETDATA_MANAGEMENT_ENABLED=${NETDATA_MANAGEMENT_ENABLED:-false}
      - NETDATA_MANAGEMENT_API_TOKEN_FILE=${NETDATA_MANAGEMENT_API_TOKEN_FILE:-/run/secrets/netdata_management_api_token}
    volumes:
      - ./config:/app/config:ro
      - ./secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - netdata-network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: ghcr.io/biezax/netdata_portal/frontend:latest
    container_name: netdata-portal-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://netdata-portal-backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - netdata-network

networks:
  netdata-network:
    driver: bridge
